name: CI

on:
  # Every branch, so a feature branch shows its status before a PR is opened.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      # Warnings are errors (see Directory.Build.props), so this step is also the
      # style gate.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: |
          dotnet test tests/RepairShop.Domain.Tests \
            --configuration Release --no-build --logger "trx;LogFileName=domain.trx"
          dotnet test tests/RepairShop.Application.Tests \
            --configuration Release --no-build --logger "trx;LogFileName=application.trx"

      # The ubuntu runner has a working Docker daemon, so Testcontainers starts a
      # real SQL Server here. On a machine without Docker these tests skip
      # themselves rather than failing.
      - name: Integration tests (Testcontainers + SQL Server)
        run: |
          dotnet test tests/RepairShop.IntegrationTests \
            --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Proves the claim in the README: a fresh clone really does build.
      - name: Build API image
        run: docker build -f src/RepairShop.Api/Dockerfile -t repair-shop-api:ci .

      - name: Build web image
        run: docker build -t repair-shop-web:ci frontend

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The snapshot itself is guarded by OpenApiContractTests on the backend;
      # this guards the other half: types regenerated after the snapshot changed.
      - name: Generated API types match the OpenAPI snapshot
        run: |
          npm run api:types
          git diff --exit-code -- src/app/core/api/schema.gen.ts

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
