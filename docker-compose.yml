# Everything this project needs: a SQL Server and the API.
# Nothing has to be installed locally beyond Docker.
#
#   cp .env.example .env   # then set your own password
#   docker compose up --build
#   open http://localhost:8080

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: repairshop-db
    environment:
      - ACCEPT_EULA=Y
      # No default: compose fails loudly if .env is missing, which beats
      # silently starting with a password that is public on GitHub.
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The API waits for this, otherwise it races SQL Server's startup and the
      # first migration attempt fails.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/RepairShop.Api/Dockerfile
    container_name: repairshop-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Deliberately not Development: Swagger is registered unconditionally, so
      # Development buys nothing here and would dump every seed INSERT as SQL
      # into the log -- a noisy first impression for the one command this repo
      # promises. Use appsettings.Development.json when running on the host.
      - ASPNETCORE_ENVIRONMENT=Production
      # Host name "db" resolves on the compose network. TrustServerCertificate
      # is acceptable here because the traffic never leaves that network; a real
      # deployment would use a proper certificate.
      - ConnectionStrings__RepairShopDb=Server=db,1433;Database=RepairShop;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  mssql-data:
