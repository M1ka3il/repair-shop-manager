# Same origin for UI and API: the browser only ever talks to this server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # "api" resolves on the compose network.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Hashed bundles never change under the same name: cache them for good.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths get the app, which routes itself.
    # index.html itself must not be cached, or a deploy never reaches users.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
