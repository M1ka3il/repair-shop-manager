<a class="skip-link" href="#main">Zum Inhalt springen</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/board">
      <svg
        aria-hidden="true"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"
        />
      </svg>
      <span>Werkstatt</span>
    </a>
    <nav aria-label="Hauptnavigation">
      @for (item of nav(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{
          item.label
        }}</a>
      }
    </nav>
    <button
      type="button"
      class="theme-toggle"
      (click)="theme.cycle()"
      [attr.aria-label]="'Farbschema: ' + theme.label() + '. Wechseln zu ' + theme.nextLabel()"
      [title]="'Farbschema wechseln (jetzt: ' + theme.label() + ')'"
    >
      @switch (theme.choice()) {
        @case ('light') {
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        }
        @case ('dark') {
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
        @default {
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8M12 16v4" />
          </svg>
        }
      }
      <span>{{ theme.label() }}</span>
    </button>
    @if (auth.isAuthenticated()) {
      <span
        class="user"
        [attr.aria-label]="'Angemeldet als ' + auth.userName() + ', ' + roleLabel()"
      >
        {{ auth.userName() }} <span class="role">{{ roleLabel() }}</span>
      </span>
      <button type="button" class="logout" (click)="logout()">Abmelden</button>
    }
    @if (auth.isOffice()) {
      <a class="btn btn-primary new-order" routerLink="/orders/new">Neuer Auftrag</a>
    }
  </div>
</header>
<main id="main" class="page">
  <router-outlet />
</main>
