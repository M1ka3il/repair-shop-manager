<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Werkstatt</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Apply a stored theme before first paint, so dark mode never flashes white. -->
    <script>
      try {
        var t = localStorage.getItem('repair-shop-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
